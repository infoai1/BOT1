    <meta charset="UTF-8">

    <title>CPS Wisdom Bot</title>
    <!-- Using Tailwind CSS for styling to match the original UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- Hide third-party branding: RAGFlow (Primary Method) --- */
        /* This is the most direct and efficient way to hide the logo.
           It targets the parent container of the logo image, ensuring
           that the entire element and its spacing are removed. */
        div:has(> img[alt="RAGFlow"]) {
            display: none !important;
        }

        /* --- Defensive/Fallback CSS Rules --- */
        /* These more generic rules catch other potential ways the branding
           might be rendered, as outlined in your plan. */
        img[alt*="RAGFlow" i],
        [class*="ragflow" i] {
            display: none !important;
        }

        /* --- Optional: Style for a replacement CPS logo --- */
        .cps-logo-container {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem; /* Adjust padding as needed */
            height: 64px; /* Matches typical header height */
        }

            font-size: 1.25rem;
            font-weight: 600;
            color: #1F2937; /* text-gray-800 */
            margin-left: 0.75rem;
        }
        .cps-logo-container svg {
             width: 32px;
             height: 32px;
        }

    </style>
</head>

    <script>
        // --- Defensive JavaScript Fallback to Remove Branding ---
        // This script runs after the page loads and acts as a backup to the CSS.
        // It actively removes any elements that match the branding signature,
        // which is useful if the branding is loaded dynamically after the initial CSS render.
        (function hideRagflowBranding() {
            const signature = 'ragflow';

            const removeNode = (node) => {
                if (node && node.parentElement) {
                    console.log('JS Fallback: Removing branding node:', node);
                    // Hide the parent for better layout collapse, similar to the CSS strategy
                    node.parentElement.style.display = 'none';
                }
            };

            const sweepAndRemove = () => {
                // First, try the most specific selector for performance
                const specificElement = document.querySelector('img[alt="RAGFlow"]');
                if (specificElement) {
                    removeNode(specificElement);
                    return; // Stop if we found the primary target
                }

                // If not found, run a broader search on all elements
                document.querySelectorAll('*').forEach(el => {
                    const content = `${el.alt || ''} ${el.title || ''} ${el.className || ''} ${el.id || ''}`.toLowerCase();
                    if (content.includes(signature)) {
                        removeNode(el);
                    }
                });
            };

            // Run when the initial HTML document has been completely loaded and parsed
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', sweepAndRemove);
            } else {
                sweepAndRemove();
            }

            // Set up a MutationObserver to watch for elements added to the page later.
            // This is robust for Single Page Applications (SPAs) where content changes.
            const observer = new MutationObserver((mutations) => {
                for (const mutation of mutations) {
                    if (mutation.addedNodes.length > 0) {
                       const found = Array.from(mutation.addedNodes).some(node =>
                            node.nodeType === 1 && (
                                (node.matches && node.matches('img[alt="RAGFlow"]')) ||
                                (node.querySelector && node.querySelector('img[alt="RAGFlow"]'))
                            )
                       );
                       if (found) {
                           sweepAndRemove();
                       }
                    }
                }
            });

            // Start observing the entire document for changes
            observer.observe(document.documentElement, {
                childList: true,
                subtree: true
            });
        })();
    </script>
